[project]
name = "aics-platform"
version = "0.1.0"
description = "Enterprise AI Customer Support Platform with LangGraph multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "redis>=5.2.0",
  "aio-pika>=9.5.0",
  "langgraph>=0.2.60",
  "langchain-core>=0.3.28",
  "openai>=1.58.0",
  "anthropic>=0.42.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.0",
  "httpx>=0.28.0",
  "email-validator>=2.2.0",
  "python-multipart>=0.0.20",
  "qdrant-client>=1.12.0",
  "neo4j>=5.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]
embeddings = [
  "sentence-transformers>=3.3.0",
  "torch>=2.5.0",
]
docs = [
  "pypdf>=5.1.0",
  "python-docx>=1.1.0",
  "beautifulsoup4>=4.12.0",
  "markdown>=3.7",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
