apiVersion: apps/v1
kind: Deployment
metadata:
  name: aics-api
  labels:
    app: aics-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aics-api
  template:
    metadata:
      labels:
        app: aics-api
    spec:
      containers:
        - name: api
          image: aics-api:0.1.0
          ports:
            - containerPort: 8917
          envFrom:
            - secretRef:
                name: aics-secrets
            - configMapRef:
                name: aics-config
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8917
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8917
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aics-api
spec:
  selector:
    app: aics-api
  ports:
    - name: http
      port: 80
      targetPort: 8917
  type: ClusterIP
